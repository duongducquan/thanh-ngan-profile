<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trần Thị Thanh Ngân | Profile</title>

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Toggle theme button -->
<button id="themeToggle" class="theme-toggle" title="Đổi giao diện sáng / tối">
  <i class="fa-solid fa-moon"></i>
</button>

<div class="profile-card">

  <!-- Banner -->
  <div class="banner">
    <img src="banner.jpg" alt="banner">
  </div>

  <!-- Avatar + Name -->
  <div class="head-block">
    <div class="avatar-wrap">
      <img src="ngan.jpg" alt="avatar" class="avatar" id="avatarImg">
    </div>
    <h1 class="name">Trần Thị Thanh Ngân <i class="fa-solid fa-circle-check verified"></i></h1>
  </div>

  <!-- Links list -->
  <div class="link-list">

    <a class="link-row" href="https://www.facebook.com/tnganncutii207" target="_blank">
      <div class="icon-circle fb-bg"><i class="fa-brands fa-facebook-f"></i></div>
      <div class="link-text">
        <div class="link-title">Facebook</div>
        <div class="link-sub">Trần Thị Thanh Ngân</div>
      </div>
      <span class="link-btn">OPEN</span>
    </a>

    <!-- Music player (YouTube) -->
    <div class="music-row">
      <img src="https://img.youtube.com/vi/vLa5jvCJMGk/mqdefault.jpg" class="music-thumb" alt="thumb">
      <div class="music-info">
        <div class="music-title">Nhạc nền</div>
        <div class="music-sub" id="musicStatus">Sẵn sàng phát</div>
      </div>
      <div class="music-controls">
        <div class="play-circle" id="playBtn"><i class="fa-solid fa-play"></i></div>
      </div>
    </div>
    <div id="ytPlayerHolder" style="display:none;"></div>

    <a class="link-row" id="tiktokLink" href="https://www.tiktok.com/@ebekittyy.27" target="_blank">
      <div class="icon-circle tiktok-bg"><i class="fa-brands fa-tiktok"></i></div>
      <div class="link-text">
        <div class="link-title">TikTok</div>
        <div class="link-sub">@ebekittyy.27</div>
      </div>
      <span class="link-btn">OPEN</span>
    </a>

    <a class="link-row" id="igLink" href="https://www.instagram.com/_kitty.bb07/" target="_blank">
      <div class="icon-circle ig-bg"><i class="fa-brands fa-instagram"></i></div>
      <div class="link-text">
        <div class="link-title">Instagram</div>
        <div class="link-sub" id="igHandle">@_kitty.bb07</div>
      </div>
      <span class="link-btn">OPEN</span>
    </a>

    <div class="link-row" id="phoneRow">
      <div class="icon-circle phone-bg"><i class="fa-solid fa-phone"></i></div>
      <div class="link-text">
        <div class="link-title">Hotline</div>
        <div class="link-sub">0378085255</div>
      </div>
      <a class="link-btn" href="tel:0378085255">CALL</a>
      <button class="copy-btn" data-copy="0378085255" title="Sao chép"><i class="fa-regular fa-copy"></i></button>
    </div>

    <div class="link-row" id="mailRow">
      <div class="icon-circle mail-bg"><i class="fa-solid fa-envelope"></i></div>
      <div class="link-text">
        <div class="link-title">Gmail</div>
        <div class="link-sub">ngankhongthichban@gmail.com</div>
      </div>
      <a class="link-btn" href="mailto:ngankhongthichban@gmail.com">MAIL</a>
      <button class="copy-btn" data-copy="ngankhongthichban@gmail.com" title="Sao chép"><i class="fa-regular fa-copy"></i></button>
    </div>

  </div>

  <div class="footer-note">© 2026 Trần Thị Thanh Ngân · Made with <i class="fa-solid fa-heart" style="color:#f43f5e;"></i></div>

</div>

<div class="toast" id="copyToast">Đã sao chép!</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
